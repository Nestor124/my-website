<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameForge — ШІ створює твою гру</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1d1b2e;--mu:#6b6882;--ac:#6c4cf1;--ac2:#fff;--bd:#e3e0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141222;--card:#1e1b33;--tx:#efedfa;--mu:#9b97b8;--ac:#8b73ff;--ac2:#fff;--bd:#33305a}}
:root[data-theme="dark"]{--bg:#141222;--card:#1e1b33;--tx:#efedfa;--mu:#9b97b8;--ac:#8b73ff;--ac2:#fff;--bd:#33305a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header b{font-size:18px;margin-right:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}button:disabled{opacity:.5;cursor:wait}
main{max-width:820px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
input,textarea{width:100%;font:inherit;padding:10px 12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
h2{margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{text-align:center}.stat b{font-size:30px;display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
iframe{width:100%;height:480px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.err{color:#d33}
.hero{border-radius:18px;overflow:hidden;margin-bottom:18px;border:1px solid var(--bd)}.hero svg{display:block;width:100%;height:auto}
.menu{max-width:420px;margin:0 auto;text-align:center}.menu h2{margin-bottom:4px}.menu button{display:block;width:100%;margin-top:10px;padding:13px}
</style></head><body>
<header><b>🎮 GameForge</b><span id="nav"></span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOTAL=10;
let me=null,db=null,sample=null,user=null,isOwn=false,view="home";
const ADMIN_EMAIL="h08417772@gmail.com";
const adm=()=>isOwn&&!!me&&String(me.email).toLowerCase()===ADMIN_EMAIL;
let chat={msgs:[],q:"",n:0,busy:false,game:null,err:""};
let mem={users:[],games:[]}; // запасний варіант, якщо база недоступна

try{me=JSON.parse(localStorage.getItem("gf_me")||"null")}catch(e){}

async function init(){
  try{user=await claude.use("user");isOwn=user?await user.isOwner():false}catch(e){}
  try{sample=await claude.use("sample")}catch(e){}
  try{db=await claude.use("db")}catch(e){}
  render();
}
function nav(){
  if(!me){$("#nav").innerHTML="";return}
  $("#nav").innerHTML=`${view!=="home"?'<button onclick="go(\'home\')">← Меню</button> ':''}<button onclick="logout()">Вийти</button>`;
}
function go(v){view=v;if(v==="new"&&!chat.msgs.length&&!chat.game)startChat();render()}
function logout(){try{localStorage.removeItem("gf_me")}catch(e){}me=null;view="home";render()}

async function register(){
  const name=$("#rn").value.trim(),email=$("#re").value.trim();
  if(!name||!/^\S+@\S+\.\S+$/.test(email)){$("#rerr").textContent="Введіть ім'я та коректну пошту";return}
  me={name,email,at:Date.now()};
  try{localStorage.setItem("gf_me",JSON.stringify(me))}catch(e){}
  const rec={name,email,at:me.at};
  try{
    if(db){const id=user?await user.id():email.replace(/\W/g,"_");me.id=id;await db.doc("users/"+id).set(rec)}
    else mem.users.push(rec);
  }catch(e){mem.users.push(rec)}
  render();
}

// ---------- ШІ-опитування ----------
const SYS=`Ти — ШІ-геймдизайнер на сайті GameForge. Ти ставиш користувачу рівно ${TOTAL} запитань по одному, щоб зрозуміти, яку гру він хоче (жанр, сюжет/тема, головний герой, керування, механіка, перешкоди/вороги, візуальний стиль, рівні/складність, звук/настрій, умови перемоги). Відповідай українською. Ставиш ТІЛЬКИ одне коротке запитання без вступів. Враховуй попередні відповіді.`;
async function ask(){
  chat.busy=true;chat.err="";render();
  try{
    const hist=chat.msgs.map(m=>`${m.r==="ai"?"ШІ":"Користувач"}: ${m.t}`).join("\n");
    const r=await sample(`${SYS}\n\nДіалог досі:\n${hist||"(порожньо)"}\n\nПоставь запитання №${chat.n+1} з ${TOTAL}. Лише текст запитання.`,{cache:false,modelTier:"quick"});
    chat.q=r.text.trim();chat.msgs.push({r:"ai",t:chat.q});
  }catch(e){chat.err="ШІ недоступний: "+(e.message||e.code||"помилка")}
  chat.busy=false;render();
}
function startChat(){chat={msgs:[],q:"",n:0,busy:false,game:null,err:""};if(sample)ask()}
async function answer(){
  const t=$("#ans").value.trim();if(!t)return;
  chat.msgs.push({r:"u",t});chat.n++;
  if(chat.n>=TOTAL)return generate();
  ask();
}
async function generate(){
  chat.busy=true;chat.err="";render();
  const hist=chat.msgs.map(m=>`${m.r==="ai"?"Питання":"Відповідь"}: ${m.t}`).join("\n");
  try{
    const r=await sample(`На основі інтерв'ю створи ПОВНУ робочу гру як ОДИН самодостатній HTML-файл (HTML+CSS+JS, без зовнішніх бібліотек і картинок, canvas або DOM, працює з клавіатури і дотику, є рахунок, програш/перемога, кнопка перезапуску, інтерфейс українською).\n\nІнтерв'ю:\n${hist}\n\nПовертай ЛИШЕ код, що починається з <!DOCTYPE html>, без пояснень і без markdown.`,{cache:false,modelTier:"complex"});
    let code=r.text.replace(/^```(?:html)?\s*/i,"").replace(/```\s*$/,"").trim();
    const i=code.indexOf("<!DOCTYPE");if(i>0)code=code.slice(i);
    const title=(code.match(/<title>(.*?)<\/title>/i)||[])[1]||"Моя гра";
    chat.game={title,code,answers:chat.msgs,at:Date.now(),owner:me.email,ownerName:me.name};
    await saveGame(chat.game);
  }catch(e){chat.err="Не вдалося створити гру: "+(e.message||e.code||"помилка")}
  chat.busy=false;render();
}
async function saveGame(g){
  const id="g"+g.at;g.id=id;
  const slim={id,title:g.title,owner:g.owner,ownerName:g.ownerName,at:g.at,answers:g.answers.length};
  try{
    if(db){
      await db.doc("games/"+id).set(slim); // для адміна
      const uid=user?await user.id():me.email.replace(/\W/g,"_");
      await db.collection("data/users/"+uid).doc(id).set(g); // повна гра — приватно
    }else mem.games.push(g)
  }catch(e){mem.games.push(g)}
}
async function myGames(){
  try{if(db){const uid=user?await user.id():me.email.replace(/\W/g,"_");const s=await db.collection("data/users/"+uid).get();return s.docs.map(d=>d.data())}}catch(e){}
  return mem.games;
}
async function download(code,title){
  try{const d=await claude.use("downloads");if(d){await d.save({filename:(title||"game").replace(/\W+/g,"_")+".html",data:code});return}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([code],{type:"text/html"}));a.download="game.html";a.click();
}

// ---------- екрани ----------
function gameView(g){
  return `<div class="card"><h2>🎉 ${esc(g.title)}</h2><iframe sandbox="allow-scripts" srcdoc="${esc(g.code)}"></iframe>
  <div class="row" style="margin-top:12px"><button class="p" onclick="download(window._g.code,window._g.title)">⬇️ Завантажити гру</button><button onclick="chat={msgs:[],q:'',n:0,busy:false,game:null,err:''};go('new')">Нова гра</button></div></div>`;
}
async function render(){
  nav();const A=$("#app");
  if(!me){
    A.innerHTML=`<div class="card"><h2>Створи свою гру з ШІ</h2><p class="mu">ШІ задасть 10 запитань про твою гру — і наприкінці ти отримаєш готову гру.</p>
    <label>Ім'я<input id="rn" placeholder="Ваше ім'я"></label><label>Пошта<input id="re" type="email" placeholder="you@mail.com"></label>
    <div id="rerr" class="err"></div><button class="p" onclick="register()">Зареєструватися</button></div>`;return;
  }
  if(view==="home"){
    A.innerHTML=`<div class="hero"><svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b1d8f"/><stop offset="1" stop-color="#e0489b"/></linearGradient></defs><rect width="800" height="300" fill="url(#g1)"/><g fill="#fff" opacity=".7"><circle cx="80" cy="50" r="3"/><circle cx="200" cy="110" r="2"/><circle cx="330" cy="40" r="3"/><circle cx="600" cy="60" r="2"/><circle cx="720" cy="130" r="3"/><circle cx="530" cy="20" r="2"/><circle cx="140" cy="220" r="2"/></g><path d="M0 260 L120 200 L220 250 L340 180 L460 255 L580 190 L700 245 L800 205 V300 H0Z" fill="#1b0f4d" opacity=".55"/><g transform="translate(400 150)"><path d="M-130 -35 Q-150 -35 -158 0 L-172 62 Q-178 92 -150 88 Q-130 84 -112 60 L-96 40 H96 L112 60 Q130 84 150 88 Q178 92 172 62 L158 0 Q150 -35 130 -35Z" fill="#fff"/><rect x="-110" y="-12" width="36" height="10" rx="3" fill="#3b1d8f"/><rect x="-97" y="-25" width="10" height="36" rx="3" fill="#3b1d8f"/><circle cx="85" cy="-18" r="11" fill="#e0489b"/><circle cx="112" cy="2" r="11" fill="#6c4cf1"/><text x="0" y="15" font-size="30" text-anchor="middle">✨</text></g></svg></div>
    <div class="card menu"><h2>Привіт, ${esc(me.name)}! 👋</h2><p class="mu">ШІ поставить ${TOTAL} запитань і створить твою гру.</p><button class="p" onclick="go('new')">🚀 Створити гру</button><button onclick="go('mine')">🎮 Мої ігри</button>${adm()?'<button onclick="go(\'admin\')">⚙️ Адмін-панель</button>':''}</div>${sample?"":'<div class="card err">ШІ зараз недоступний у цьому вікні перегляду.</div>'}`;
  }
  else if(view==="new"){
    if(chat.game){window._g=chat.game;A.innerHTML=gameView(chat.game);return}
    const pct=Math.round(chat.n/TOTAL*100);
    let body="";
    if(!sample)body=`<p class="err">ШІ недоступний.</p>`;
    else if(chat.busy&&chat.n>=TOTAL)body=`<p>⏳ ШІ створює вашу гру… Це може тривати до хвилини.</p>`;
    else if(chat.busy)body=`<p>⏳ ШІ думає…</p>`;
    else body=`<p><b>Запитання ${chat.n+1} з ${TOTAL}</b></p><p>${esc(chat.q)}</p><textarea id="ans" rows="3" placeholder="Ваша відповідь…"></textarea><button class="p" onclick="answer()">${chat.n+1===TOTAL?"Створити гру 🎮":"Далі →"}</button>`;
    A.innerHTML=`<div class="card"><h2>Конструктор гри</h2><div class="bar"><i style="width:${pct}%"></i></div>${body}${chat.err?`<p class="err">${esc(chat.err)}</p><button onclick="${chat.n>=TOTAL?'generate()':'ask()'}">Спробувати ще раз</button>`:""}</div>`;
  }
  else if(view==="mine"){
    A.innerHTML=`<div class="card">Завантаження…</div>`;
    const gs=(await myGames()).sort((a,b)=>b.at-a.at);window._gs=gs;
    A.innerHTML=`<div class="card"><h2>Мої ігри</h2>${gs.length?gs.map((g,i)=>`<div class="row" style="justify-content:space-between;align-items:center;padding:6px 0"><span>${esc(g.title)} <span class="mu">${new Date(g.at).toLocaleDateString("uk")}</span></span><button onclick="openGame(${i})">Відкрити</button></div>`).join(""):'<p class="mu">Ігор ще немає.</p>'}</div>`;
  }
  else if(view==="admin"&&adm()){
    let users=mem.users,games=mem.games;
    try{if(db){users=(await db.collection("users").get()).docs.map(d=>d.data());games=(await db.collection("games").get()).docs.map(d=>d.data())}}catch(e){}
    users.sort((a,b)=>b.at-a.at);games.sort((a,b)=>b.at-a.at);
    const day=Date.now()-864e5;
    A.innerHTML=`<div class="stats"><div class="card stat"><b>${users.length}</b>Користувачів</div><div class="card stat"><b>${games.length}</b>Створено ігор</div><div class="card stat"><b>${games.filter(g=>g.at>day).length}</b>Ігор за 24 год</div><div class="card stat"><b>${users.filter(u=>u.at>day).length}</b>Нових за 24 год</div></div>
    <div class="card"><h2>Користувачі</h2><div class="tw"><table><tr><th>Ім'я</th><th>Пошта</th><th>Реєстрація</th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${new Date(u.at).toLocaleString("uk")}</td></tr>`).join("")||"<tr><td colspan=3 class=mu>Порожньо</td></tr>"}</table></div></div>
    <div class="card"><h2>Усі ігри</h2><div class="tw"><table><tr><th>Назва</th><th>Автор</th><th>Дата</th></tr>${games.map(g=>`<tr><td>${esc(g.title)}</td><td>${esc(g.ownerName)} (${esc(g.owner)})</td><td>${new Date(g.at).toLocaleString("uk")}</td></tr>`).join("")||"<tr><td colspan=3 class=mu>Порожньо</td></tr>"}</table></div></div>`;
  }
}
function openGame(i){window._g=window._gs[i];$("#app").innerHTML=gameView(window._g)}
init();
</script></body></html>
